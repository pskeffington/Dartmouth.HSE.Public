name: Public originality screening

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: originality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  originality:
    name: Public change validation and originality review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out all tracked source files
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run public originality screening
        id: screen
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/check_public_originality.py --json --fail-on-review > originality-report.json
          result=$?
          set -e
          python3 -m json.tool originality-report.json > /dev/null
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path("originality-report.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## Public originality screening\n\n")
              out.write(f"**Status:** {report['status']}  \n")
              out.write(f"**Tracked files:** {report['tracked_files']}  \n")
              out.write(f"**Findings:** {len(report['findings'])}\n\n")
              out.write("Heuristic screening is not proof of ownership or copyright clearance. REVIEW findings require documented clearance. Whole-repository clearance remains on hold; ordinary change validation may retain byte-identical baseline reviews without marking them cleared.\n\n")
              for item in report['findings'][:100]:
                  out.write(f"- **{item['level'].upper()}** `{item['path']}`: {item['reason']}\n")
          PY
          exit "$result"
      - name: Check for new or changed originality findings
        id: change
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
        continue-on-error: true
        shell: bash
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 scripts/check_originality_change.py --base "$CHANGE_BASE" --output originality-change-report.json
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          report = json.loads(Path("originality-change-report.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n## Ordinary change validation\n\n")
              out.write(f"**Change:** {report['change_status']}  \n")
              out.write(f"**Full repository:** {report['full_repository_status']}  \n")
              out.write("Unchanged reviews remain unresolved; this does not certify copyright clearance.\n\n")
              for item in report["retained_unresolved_reviews"]:
                  out.write(f"- Retained review: `{item['path']}` — {item['reason']}\n")
          PYTHON
      - name: Run originality-regression tests
        id: regression
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 -m unittest discover -s tests -v
      - name: Verify public reading editions are current
        id: editions
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 06_RESOURCES/Presentation/build_reading_editions.py --check
      - name: Verify internal documentation navigation
        id: navigation
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 06_RESOURCES/Presentation/check_navigation.py
      - name: Compile Python validation and publication scripts
        id: compilation
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 -m py_compile scripts/check_public_originality.py scripts/build_provenance_inventory.py scripts/build_originality_triage.py 06_RESOURCES/Presentation/*.py
      - name: Inventory tracked artifact provenance
        id: inventory
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 scripts/build_provenance_inventory.py --output provenance-inventory.json
      - name: Build unresolved originality review queue
        id: triage
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 scripts/build_originality_triage.py originality-report.json --output originality-triage.md
      - name: Save screening report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: originality-screening-report
          path: |
            originality-report.json
            originality-change-report.json
            originality-triage.md
            provenance-inventory.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce originality release decision
        if: always()
        shell: bash
        env:
          CHANGE_OUTCOME: ${{ steps.change.outcome }}
          SCREEN_OUTCOME: ${{ steps.screen.outcome }}
          TEST_OUTCOME: ${{ steps.regression.outcome }}
          EDITION_OUTCOME: ${{ steps.editions.outcome }}
          NAV_OUTCOME: ${{ steps.navigation.outcome }}
          COMPILE_OUTCOME: ${{ steps.compilation.outcome }}
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          TRIAGE_OUTCOME: ${{ steps.triage.outcome }}
        run: |
          failed=0
          if [ "$SCREEN_OUTCOME" != "success" ] && [ "$CHANGE_OUTCOME" = "success" ]; then
            echo "Full strict screening remains unresolved; the change has no new or modified findings."
            SCREEN_OUTCOME=success
          fi
          checks=(SCREEN TEST EDITION NAV COMPILE INVENTORY TRIAGE)
          outcomes=("$SCREEN_OUTCOME" "$TEST_OUTCOME" "$EDITION_OUTCOME"
                    "$NAV_OUTCOME" "$COMPILE_OUTCOME" "$INVENTORY_OUTCOME" "$TRIAGE_OUTCOME")
          for i in "${!checks[@]}"; do
            if [ "${outcomes[i]}" != "success" ]; then
              echo "::error::${checks[i]} gate did not pass (outcome: ${outcomes[i]})"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "The public-release gate remains closed. Inspect each reported check."
            exit 1
          fi
